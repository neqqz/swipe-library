name: Build Swipe Library

on:
  push:
    branches: [ "master", "fix/**" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Cache ExecuTorch build
        uses: actions/cache@v4
        with:
          path: third_party/executorch/cmake-out-${{ matrix.abi }}
          key: et-${{ matrix.abi }}-${{ hashFiles('third_party/executorch/**', 'patches/**', 'models/*/ops.txt') }}

      - name: Build Android Library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make android-${{ matrix.abi }}

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libswipe_jni-${{ matrix.abi }}
          path: |
            build-android-${{ matrix.abi }}/libswipe_jni.so
            build-android-${{ matrix.abi }}/benchmark_e2e
            build-android-${{ matrix.abi }}/eval_accuracy
            build-android-${{ matrix.abi }}/infer_jsonl

  build-aar:
    name: Build Android AAR
    needs: build-android
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Stage native libraries for AAR packaging
        run: |
          mkdir -p android/src/main/jniLibs/arm64-v8a
          mkdir -p android/src/main/jniLibs/armeabi-v7a
          mkdir -p android/src/main/jniLibs/x86_64
          mkdir -p android/src/main/jniLibs/x86

          cp downloaded-artifacts/libswipe_jni-arm64-v8a/libswipe_jni.so android/src/main/jniLibs/arm64-v8a/
          cp downloaded-artifacts/libswipe_jni-armeabi-v7a/libswipe_jni.so android/src/main/jniLibs/armeabi-v7a/
          cp downloaded-artifacts/libswipe_jni-x86_64/libswipe_jni.so android/src/main/jniLibs/x86_64/
          cp downloaded-artifacts/libswipe_jni-x86/libswipe_jni.so android/src/main/jniLibs/x86/

          # Также копируем libc++_shared.so из NDK для каждой ABI
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          SYSROOT="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          cp "$SYSROOT/aarch64-linux-android/libc++_shared.so" android/src/main/jniLibs/arm64-v8a/
          cp "$SYSROOT/arm-linux-androideabi/libc++_shared.so" android/src/main/jniLibs/armeabi-v7a/
          cp "$SYSROOT/x86_64-linux-android/libc++_shared.so" android/src/main/jniLibs/x86_64/
          cp "$SYSROOT/i686-linux-android/libc++_shared.so" android/src/main/jniLibs/x86/

      - name: Build AAR with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x externalNativeBuildRelease

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: swipe-library-aar
          path: android/build/outputs/aar/*.aar

  build-host:
    name: Build Host & Run Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3-venv

      - name: Cache Host ExecuTorch build
        uses: actions/cache@v4
        with:
          path: third_party/executorch/cmake-out-host
          key: et-host-${{ hashFiles('third_party/executorch/**', 'patches/**', 'models/*/ops.txt') }}

      - name: Build Host
        run: |
          make host

      - name: Run Host Tests
        run: |
          make test

      - name: Upload Host Binaries
        uses: actions/upload-artifact@v4
        with:
          name: host-binaries
          path: |
            build/libswipe_decoder.a
            build/test_beam_search
            build/test_vocab_hash
            build/test_engine
